name: Build PATRI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar projeto Android
        run: |
          rm -rf patri_android
          unzip -o PATRI_Android_projeto_v7_3_8.zip
          test -f patri_android/settings.gradle

      - name: Corrigir abertura do PATRI
        working-directory: patri_android
        run: |
          cat > app/src/main/java/br/com/patri/app/MainActivity.java <<'EOF'
          package br.com.patri.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.net.Uri;
          import androidx.browser.customtabs.CustomTabsIntent;

          public class MainActivity extends Activity {
              private static final String START_URL = "https://admgestao.netlify.app/";

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      CustomTabsIntent intent = new CustomTabsIntent.Builder().build();
                      intent.launchUrl(this, Uri.parse(START_URL));
                  } catch (Exception e) {
                      startActivity(new android.content.Intent(
                              android.content.Intent.ACTION_VIEW,
                              Uri.parse(START_URL)
                      ));
                  }
              }
          }
          EOF

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: patri_android
        run: gradle assembleDebug --no-daemon

      - name: Verificar assinatura Android
        working-directory: patri_android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PATRI-debug-apk-corrigido
          path: patri_android/app/build/outputs/apk/debug/app-debug.apk
