name: Build PATRI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar projeto Android
        run: |
          rm -rf patri_android
          unzip -o PATRI_Android_projeto_v7_3_8.zip
          test -f patri_android/settings.gradle

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: patri_android
        run: gradle assembleDebug --no-daemon

      - name: Verificar assinatura Android
        working-directory: patri_android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PATRI-debug-apk
          path: patri_android/app/build/outputs/apk/debug/app-debug.apk
